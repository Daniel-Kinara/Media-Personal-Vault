<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks the current URL and redirects to index.html with the path as a query parameter
      // It allows BrowserRouter to work on GitHub Pages
      
      (function(location) {
        const segmentCount = 0; // Set to 1 if your site is at username.github.io/repo-name/
        const l = location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
          l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
          (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })(window.location);
    </script>
  </head>
  <body>
    <noscript>
      <h1>JavaScript Required</h1>
      <p>This single-page application requires JavaScript to function properly.</p>
      <p>Please enable JavaScript and refresh the page.</p>
    </noscript>
    <script>
  // Single Page Apps for GitHub Pages
  // MIT License
  // https://github.com/rafgraph/spa-github-pages
  // This script takes the current URL and converts the path and query
  // string into just a query string, and then redirects the browser
  // to the new URL with only a query string and hash fragment.
  
  (function(l) {
    if (l.search[1] === '/' ) {
      var decoded = l.search.slice(1).split('&').map(function(s) { 
        return s.replace(/~and~/g, '&')
      }).join('?');
      window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
      );
    }
   })(window.location)
  </script>
  </body>
</html>
