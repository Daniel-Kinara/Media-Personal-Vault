<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // SPA GitHub Pages Redirect
    // Redirects all 404s to index.html with proper query params
    sessionStorage.redirect = location.pathname;
    
    // Determine the base path
    const pathSegments = location.pathname.split('/');
    const repoName = pathSegments[1] || ''; // Get repo name from URL
    
    // Redirect to index.html with the path as a query parameter
    const basePath = repoName ? `/${repoName}/` : '/';
    const redirectPath = location.pathname.replace(new RegExp(`^${basePath}`), '');
    
    location.replace(`${basePath}?redirect=${encodeURIComponent(redirectPath)}`);
  </script>
</head>
<body>
  <noscript>
    <h1>Redirecting...</h1>
    <p>If you are not redirected, <a href="./">click here</a>.</p>
  </noscript>
  
</body>
</html>
