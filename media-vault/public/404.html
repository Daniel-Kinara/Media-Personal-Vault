<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Simple redirect for GitHub Pages SPA
    const path = window.location.pathname;
    const repo = path.split('/')[1] || '';
    const base = repo ? `/${repo}/` : '/';
    
    // Store current path and redirect to index
    sessionStorage.setItem('redirect', path);
    window.location.href = base;
  </script>
</head>
<body>
  <noscript>Please enable JavaScript or <a href="./">click here</a></noscript>
</body>
</html>
